<style>
:root{--bg:#0b0a1f;--ring:#3b3a6b;--ship:#ffd166;--bad:#ff4d6d;--gem:#4cc9f0;--ink:#f2f0ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#nick{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(11,10,31,.985);padding:20px;box-sizing:border-box;color:var(--ink);font:600 18px system-ui,sans-serif;z-index:5}
#lans{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;gap:16px;padding:22px 16px 30px;box-sizing:border-box;overflow-y:auto;background:radial-gradient(circle at 50% -10%,#3a2a8a,#17123f 45%,#0b0a1f 75%);color:#f2f0ff;font:600 16px system-ui,sans-serif;z-index:4;-webkit-user-select:none;user-select:none}
#lans .card{width:min(92vw,400px);box-sizing:border-box;border-radius:20px;padding:16px;background:linear-gradient(160deg,#211a5c,#120f35);border:2px solid #4b3fa3;box-shadow:0 10px 30px #0006}
#lans .btn{display:inline-block;padding:12px 22px;border-radius:12px;background:#ffd166;color:#0b0a1f;font-weight:800;font-size:17px;cursor:pointer}
#lans .chip{padding:8px 14px;border-radius:999px;background:#ffffff14;border:1px solid #ffffff26;font-size:15px;font-weight:700;cursor:pointer}
#nick input{font:inherit;padding:12px 16px;border-radius:10px;border:2px solid var(--ring);background:#14123a;color:var(--ink);text-align:center;width:min(70vw,260px);-webkit-user-select:text;user-select:text}
#nick button{font:inherit;padding:12px 28px;border:0;border-radius:10px;background:var(--ship);color:#0b0a1f;font-weight:800}
#skins{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:6px;z-index:4;flex-wrap:wrap;padding:0 8px}

async function loadBoard(){if(!DB_URL)return;try{const r=await fetch(DB_URL+'/scores.json?orderBy=%22score%22&limitToLast=300');const d=await r.json();boardErr=(d&&d.error)?String(d.error):'';const ms=[{},{},{},{},{},{},{},{},{}];for(const k in d||{}){const s=d[k];if(!s||!s.name)continue;if(badNick(s.name))s.name='*'.repeat(Math.max(3,Math.min(String(s.name).length,8)));const m=ms[s.st===9?8:s.st===8?7:s.st===7?6:s.st===6?5:s.st===5?4:s.st===4?3:s.st===3?2:s.st===2?1:0];if(!m[s.name]||s.score>m[s.name])m[s.name]=s.score}const tb=m=>Object.keys(m).map(n=>({name:n,score:m[n]})).sort((x,y)=>y.score-x.score).slice(0,3);board=tb(ms[0]);board2=tb(ms[1]);board3=tb(ms[2]);board4=tb(ms[3]);board5=tb(ms[4]);board6=tb(ms[5]);board7=tb(ms[6]);board8=tb(ms[7]);board9=tb(ms[8]);restoreFromBoard(ms)}catch(e){boardErr='нет связи'}}

function mergeData(c,l,login){c=c||{};const o=Object.assign({},c);const J=v=>{try{return JSON.parse(v||'null')}catch(e){return null}};
  for(const k in l){const lv=l[k],cv=c[k];
    if(/^best/.test(k))o[k]=String(Math.max(+cv||0,+lv||0));
    else if(k==='ach')o[k]=JSON.stringify(Object.assign({},J(cv)||{},J(lv)||{}));
    else if(k==='codes'){const a=J(cv)||[],b=J(lv)||[];o[k]=JSON.stringify([...new Set([...a,...b])])}
    else if(k==='allst'){if(lv==='1'||cv==='1')o[k]='1'}
    else if((k==='money'||k==='c_gold'||k==='c_trophies')&&login)o[k]=String(Math.max(+cv||0,+lv||0));
    else if(k==='c_mmr'||k==='c_w'||k==='c_l'){if(login||cv===undefined)o[k]=String(Math.max(+cv||0,+lv||0))}
    else if(k==='c_codes'){const a=J(cv)||[],b=J(lv)||[];o[k]=JSON.stringify([...new Set([...a,...b])])}
    else if(k==='c_owned'){const a=J(cv)||[],b=J(lv)||[];o[k]=JSON.stringify([...new Set([...a,...b])])}
