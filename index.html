<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Орбита</title>
<style>
:root{--bg:#0b0a1f;--ring:#3b3a6b;--ship:#ffd166;--bad:#ff4d6d;--gem:#4cc9f0;--ink:#f2f0ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#nick{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(11,10,31,.92);color:var(--ink);font:600 18px system-ui,sans-serif;z-index:5}
#nick input{font:inherit;padding:12px 16px;border-radius:10px;border:2px solid var(--ring);background:#14123a;color:var(--ink);text-align:center;width:min(70vw,260px);-webkit-user-select:text;user-select:text}
#nick button{font:inherit;padding:12px 28px;border:0;border-radius:10px;background:var(--ship);color:#0b0a1f;font-weight:800}
#skins{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:6px;z-index:4;flex-wrap:wrap;padding:0 8px}
#skins button{font:600 15px system-ui,sans-serif;padding:7px 8px;border-radius:10px;background:#14123a;border:2px solid transparent}
#achP{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,10,31,.95);color:var(--ink);font:600 16px system-ui,sans-serif;z-index:6;padding:24px;text-align:center;overflow-y:auto}
#skP{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(11,10,31,.96);color:var(--ink);font:600 16px system-ui,sans-serif;z-index:6;padding:24px;overflow-y:auto}
#pauseBtn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;font:700 20px system-ui,sans-serif;width:44px;height:44px;border-radius:12px;border:2px solid #3b3a6b;background:#14123a;color:#f2f0ff;display:none}
#stBtn{position:fixed;left:10px;right:10px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:4;display:none;gap:6px;justify-content:center}
#stBtn button{flex:1;max-width:110px;font:700 13px system-ui,sans-serif;padding:10px 4px;border-radius:12px;border:2px solid #4cc9f0;background:#14123a;color:#9be7ff}
</style>
</head>
<body>
<canvas id="c" aria-label="Игра Орбита"></canvas>
<div id="nick"><div>Как тебя зовут в рейтинге?</div><input id="nickIn" maxlength="12" placeholder="Ник" autocomplete="off"><button id="nickBtn">Играть</button></div>
<div id="skins"></div>
<div id="achP"></div>
<div id="skP"></div>
<div id="stBtn"></div>
<button id="pauseBtn" aria-label="Пауза">⏸</button>
<script>
try{if(localStorage.getItem('orbita-ver')!=='2'){['orbita-best','orbita-best2','orbita-skin','orbita-ach'].forEach(k=>localStorage.removeItem(k));localStorage.setItem('orbita-ver','2')}}catch(e){}
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,cx,cy,R,Rb,dpr;
function fit(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);cx=W/2;cy=H/2;R=Rb=Math.min(W,H)*0.3}
addEventListener('resize',fit);fit();
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C={bg:css('--bg'),ring:css('--ring'),ship:css('--ship'),bad:css('--bad'),gem:css('--gem'),ink:css('--ink')};
const PAL=[{bg:'#0b0a1f',ring:'#3b3a6b',gem:'#4cc9f0',bad:'#ff4d6d'},{bg:'#1a0b24',ring:'#6b3a6b',gem:'#ff9bf0',bad:'#ffb347'},{bg:'#1f0d0a',ring:'#6b3a2b',gem:'#ffd166',bad:'#ff4d6d'},{bg:'#061a1a',ring:'#2b6b5f',gem:'#b8f2e6',bad:'#c77dff'}];
const PAL2=[{bg:'#04202e',ring:'#2a6f97',gem:'#f1faee',bad:'#ff6b6b'},{bg:'#021b2b',ring:'#1b9aaa',gem:'#ffe66d',bad:'#ff6b35'},{bg:'#0a1128',ring:'#3f51b5',gem:'#a2d2ff',bad:'#ff4d6d'},{bg:'#001f2d',ring:'#00a896',gem:'#ffd166',bad:'#e63946'}];
const PAL3=[{bg:'#05030d',ring:'#5b3a8a',gem:'#9bf6ff',bad:'#ff4d6d'},{bg:'#05030d',ring:'#5b3a8a',gem:'#9bf6ff',bad:'#ff4d6d'},{bg:'#05030d',ring:'#5b3a8a',gem:'#9bf6ff',bad:'#ff4d6d'},{bg:'#05030d',ring:'#5b3a8a',gem:'#9bf6ff',bad:'#ff4d6d'}];
const PAL4=[1,2,3,4].map(()=>({bg:'#120903',ring:'#9a7b4f',gem:'#ffd166',bad:'#ff5d3a'}));
const PAL5=[1,2,3,4].map(()=>({bg:'#040a1c',ring:'#4b6fb5',gem:'#9bf6ff',bad:'#ff6b6b'}));
function applyPal(){Object.assign(C,(stage===5?PAL5:stage===4?PAL4:stage===3?PAL3:stage===2?PAL2:PAL)[(lvl-1)%4])}
let best=0;try{best=+localStorage.getItem('orbita-best')||0}catch(e){}
const DB_URL='https://orbital-c41b8-default-rtdb.firebaseio.com';
let nick='';try{nick=localStorage.getItem('orbita-nick')||''}catch(e){}if(badNick(nick))nick='';
let board=[],board2=[],board3=[],board4=[],board5=[],boardErr='';
const nickEl=document.getElementById('nick'),nickIn=document.getElementById('nickIn');
function nickOpen(){return nickEl.style.display==='flex'}
function badNick(n){let x=String(n).toLowerCase().replace(/ё/g,'е');const en=x.replace(/[^a-z]/g,'');
if(/f+u+c+k|fck|blyat|blyad|blya|suka|pizd|pidor|pidar|hui|huy|xui|xuy|shit|bitch|cunt|dick|nigg|whore|slut|asshole|pussy|cock|bastard|fuk/.test(en))return true;
const mp={a:'а',e:'е',o:'о',p:'р',c:'с',x:'х',y:'у',k:'к',m:'м',t:'т',h:'н',b:'в','0':'о','3':'з','6':'б','4':'ч','@':'а','$':'с'};
x=x.replace(/[a-z0-9@$]/g,ch=>mp[ch]||ch).replace(/[^а-я]/g,'').replace(/(.)\1+/g,'$1');
return /х+у+[йеяию]|хуел|хуйн|пизд|пезд|бля[дт]|блеа|бляя|сука|сучк|сучар|пидо?р|пидр|педик|мудак|мудил|мудо|гандон|гондон|залуп|шлюх|шалав|дроч|говн|жопа|манд[ао]|долбо[её]б|уеб|(^|по|на|за|у|вы|до|съ|от|об|пере|при|про|раз|с|ни)е+б(ат|ан|ал|л|у|и|ну|ыр|ис|ло)|ебл|еблан|ебуч|херн|хер(а|ов|ню)|ссык|чмо|нахуй|нахер|гнида|тварь|урод/.test(x)}
function askNick(){nickEl.style.display='flex';nickIn.value=nick;setTimeout(()=>nickIn.focus(),50)}
document.getElementById('nickBtn').onclick=()=>{const v=nickIn.value.trim().slice(0,12);if(!v)return;if(badNick(v)){nickIn.value='';nickIn.placeholder='Нельзя такой ник';nickIn.focus();return}nick=v;try{localStorage.setItem('orbita-nick',nick)}catch(e){}nickEl.style.display='none'};
async function loadBoard(){if(!DB_URL)return;try{const r=await fetch(DB_URL+'/scores.json?orderBy=%22score%22&limitToLast=150');const d=await r.json();boardErr=(d&&d.error)?String(d.error):'';const ms=[{},{},{},{},{}];for(const k in d||{}){const s=d[k];if(!s||!s.name)continue;if(badNick(s.name))s.name='*'.repeat(Math.max(3,Math.min(String(s.name).length,8)));const m=ms[s.st===5?4:s.st===4?3:s.st===3?2:s.st===2?1:0];if(!m[s.name]||s.score>m[s.name])m[s.name]=s.score}const tb=m=>Object.keys(m).map(n=>({name:n,score:m[n]})).sort((x,y)=>y.score-x.score).slice(0,3);board=tb(ms[0]);board2=tb(ms[1]);board3=tb(ms[2]);board4=tb(ms[3]);board5=tb(ms[4])}catch(e){boardErr='нет связи'}}
async function submit(s){if(!DB_URL||!nick||s<1||badNick(nick))return;try{await fetch(DB_URL+'/scores.json',{method:'POST',body:JSON.stringify({name:nick,score:s,st:stage})});await loadBoard()}catch(e){}}
if(!nick)askNick();loadBoard();
const AL=[{id:'g20',n:'Охотник',d:'собери 20 кристаллов за игру'},{id:'boss',n:'Победитель',d:'победи босса'},{id:'shield',n:'Щитовик',d:'спаси корабль щитом'},{id:'time',n:'Хозяин времени',d:'останови время'},{id:'mag',n:'Магнитчик',d:'подбери магнит'},{id:'lvl3',n:'Космонавт',d:'дойди до 3 уровня'},{id:'st2',n:'Мореплаватель',d:'набери 70 очков и открой океан'},{id:'g50',n:'Коллекционер',d:'собери 50 кристаллов за игру'},{id:'g100',n:'Легенда',d:'набери 100 очков'},{id:'lvl5',n:'Звёздный капитан',d:'дойди до 5 уровня'},{id:'ocean',n:'Покоритель океана',d:'набери 20 очков на океане'},{id:'shield3',n:'Неуязвимый',d:'спаси корабль щитом 3 раза за игру'},{id:'st3',n:'Исследователь',d:'набери 50 очков на океане и открой лабиринт'},{id:'lab',n:'Выход из тьмы',d:'набери 30 очков в лабиринте'},{id:'dark',n:'Хранитель тьмы',d:'победи босса в лабиринте'},{id:'lab100',n:'Повелитель лабиринта',d:'набери 100 очков в лабиринте'},{id:'gear',n:'Механик',d:'набери 50 очков в ивенте и получи скин Шестерня'},{id:'mask',n:'Без маски',d:'набери 30 очков в ивенте «В маске»'},{id:'face',n:'Greanlander',d:'набери 50 очков в «В маске» и получи скин с его лицом'}];
let ach={};try{ach=JSON.parse(localStorage.getItem('orbita-ach')||'{}')}catch(e){}
let toast='',toastT=0;
function unlock(id){if(ach[id])return;ach[id]=1;try{localStorage.setItem('orbita-ach',JSON.stringify(ach))}catch(e){}const a=AL.find(x=>x.id===id);toast=a.n;toastT=3}
const achP=document.getElementById('achP');
achP.onclick=()=>{achP.style.display='none'};
function showAch(){achP.innerHTML='<div style="font-size:24px;font-weight:800">Достижения</div>'+AL.map(a=>'<div style="opacity:'+(ach[a.id]?1:.45)+'">'+(ach[a.id]?'✅ ':'🔒 ')+a.n+' — '+a.d+'</div>').join('')+'<div style="opacity:.6;margin-top:12px">Коснись, чтобы закрыть</div>';achP.style.display='flex'}
const SK=[{n:'Классика',c:'#ffd166',r:0,e:'⚪'},{n:'Комета',c:'#4cc9f0',r:10,e:'☄️'},{n:'Роза',c:'#ff7eb6',r:25,e:'🌹'},{n:'Призрак',c:'#ffffff',r:50,e:'👻'},{n:'Ракета',c:'#ff8c42',r:100,e:'🚀'},{n:'Elinion',c:'#00690e',t:'#b05cff',r:1e9,e:'🟩'},{n:'Пчела',c:'#ffcc00',r:1e9,e:'🐝'},{n:'Шестерня',c:'#b8c2cc',t:'#a9b2bc',r:1e9,e:'⚙️'},{n:'Greanlander',c:'#2f9be8',t:'#6fd0ff',r:1e9,e:'🌍'}];
const PIX=new Image();PIX.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAACKUlEQVR4AexWvU7DMBC+ZkCgSkUwMDA3T1EmJkbExCvwROxMTIixC0yEl0hnBgYqUlWgLsVf4rMvdlwnVYOERJUvd77fz72kbkLu52a0pj7h9PMJOAF9L/8IgeWaCOjh60i8ebtNuPFw4HoC63Nll1BLeTnPV7sRtG4uOzk6b8QxbyaApK7Nl9+2hdSttaY1E0BjoGtzLi0bo46xq2eJdS19Apxgmst5QteZRsBmka+mlH1OKZ8/EnQTZuoZS6n4BBAIlO7AjUkG3F3MPoG22SBRQsy8KVduRuo61hJAMW2MChRiIBgzZ6j1yYG6tbwsAZ2QvRUE5PNCzRFQs8Q8NcowkGVQRjR8tSgD7M3WQa3COrRWEUAxbYCI7oB3D4kE5APQO6IigCQuBj0G2Qx5jFheg98S0M7o7nVceTaACIPtHWVFADvQiek9DRjHL2OSgJ1uiwHdLXzAroCY8RWRBGwM3caIioBZ/r7yTyBx39P8mtaMj7MZSbA9JmcPRBIy3h3yzkbw/kUEuA1ia4/ANkW4SatX2HltPQJcrA9pNidee4/A5PCC0j2Fo0tKFVwisEm09XPzfLXQZ0x1NngEaLjv1oyuuXgokP1NI/IJhKpE7E3FkbKpOfw7I4BiHvAfQRlD5JSLEv6NZkn0XJ3tyyflV7q61y/YLNKjEU1OR+p5qVDmo0aZn9V8iOU+LPv7BvCkA3X23ipMoEWyV20LQ5jAFsWaUmK2HwAAAP//eafXPwAAAAZJREFUAwAZqC5QLHQnewAAAABJRU5ErkJggg==';
/* ===== СЕКРЕТНЫЕ КОДЫ: 'КОД':номер скина. Коды пиши ЗАГЛАВНЫМИ буквами. Пока пусто ===== */
const CODES={'OKAK228MINESHPEEL':5,'PCHELA228':6,'GEAR-X7K9-ORBITA-2026':7};
let unl=[];try{unl=JSON.parse(localStorage.getItem('orbita-codes')||'[]')}catch(e){}
const has=i=>best>=SK[i].r||unl.includes(i);
let skin=0,lastMode='',stage=1,best2=0,best3=0,best4=0,best5=0;try{best2=+localStorage.getItem('orbita-best2')||0;best3=+localStorage.getItem('orbita-best3')||0;best4=+localStorage.getItem('orbita-best4')||0;best5=+localStorage.getItem('orbita-best5')||0}catch(e){}
const bb=()=>stage===5?best5:stage===4?best4:stage===3?best3:stage===2?best2:best;
const stBtn=document.getElementById('stBtn');
function nextStage(){const av=[1];if(best>=70)av.push(2);if(best2>=50)av.push(3);av.push(4);return av[(av.indexOf(stage)+1)%av.length]}
const STN={1:'🌌 Этап 1',2:'🌊 Этап 2',3:'🕳️ Этап 3',4:'⚙️ Ивент'};
const STL={1:'🌌 Этап 1',2:'🌊 Этап 2',3:'🕳️ Этап 3',4:'⚙️ Ивент'};
function stOpen(i){return i===1||i>=4||(i===2&&best>=70)||(i===3&&best2>=50)}
function renderStages(){stBtn.innerHTML='';for(const i of [1,2,3,4]){const b=document.createElement('button'),o=stOpen(i);
  b.textContent=o?STL[i]:'🔒 '+(i===2?'Этап 2':'Этап 3');b.style.opacity=o?1:0.5;
  if(i===stage){b.style.background='#4cc9f0';b.style.color='#0b0a1f'}
  b.onclick=()=>{if(!o||stage===i)return;stage=i;lvl=1;applyPal();renderSkins()};stBtn.appendChild(b)}}
try{skin=+localStorage.getItem('orbita-skin')||0}catch(e){}
if(!SK[skin]||!has(skin))skin=0;
C.ship=SK[skin].c;
const skEl=document.getElementById('skins');
const skP=document.getElementById('skP');
function showSkins(){
  skP.innerHTML='';
  const h=document.createElement('div');h.textContent='Скины';h.style.cssText='font-size:24px;font-weight:800';skP.appendChild(h);
  const grid=document.createElement('div');grid.style.cssText='display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(90vw,360px)';
  SK.forEach((s,i)=>{
    const ok=has(i);if(s.r>=1e9&&!ok)return;if(s.r>=1e9&&!ok)return;
    const card=document.createElement('div');card.style.cssText='background:#14123a;border:2px solid '+(i===skin?s.c:'#2b2a55')+';border-radius:14px;padding:10px;text-align:center;opacity:'+(ok?1:0.6);
    const cvp=document.createElement('canvas');cvp.width=64;cvp.height=64;cvp.style.cssText='position:static;inset:auto;width:64px;height:64px;display:block;margin:0 auto';
    const x=cvp.getContext('2d');x.fillStyle=ok?s.c:'#55527f';drawSkin(32,34,i,x,-Math.PI,1);
    const nm=document.createElement('div');nm.textContent=s.n;nm.style.cssText='font-size:15px;margin-top:4px';
    const st=document.createElement('div');st.style.cssText='font-size:12px;opacity:.8';st.textContent=ok?(i===skin?'выбран':'выбрать'):(s.r>=1e9?'🔒 секретный код':'🔒 '+s.r+' очков');
    card.appendChild(cvp);card.appendChild(nm);card.appendChild(st);
    card.onclick=()=>{if(!ok)return;skin=i;C.ship=s.c;try{localStorage.setItem('orbita-skin',i)}catch(e){}showSkins()};
    grid.appendChild(card)});
  skP.appendChild(grid);
  const cl=document.createElement('div');cl.textContent='Закрыть';cl.style.cssText='margin-top:8px;padding:10px 24px;border-radius:10px;background:#ffd166;color:#0b0a1f;font-weight:800';cl.onclick=()=>{skP.style.display='none';renderSkins()};
  skP.appendChild(cl);skP.style.display='flex'}
function renderSkins(){skEl.innerHTML='';
  const sb=document.createElement('button');sb.textContent='🗺️ Этапы';sb.style.color='#9be7ff';sb.onclick=showStages;skEl.appendChild(sb);
  const b=document.createElement('button');b.textContent='🎨 Скины';b.style.color='#ffd166';b.onclick=showSkins;skEl.appendChild(b);
  const ab=document.createElement('button');ab.textContent='🏆 '+Object.keys(ach).length+'/'+AL.length;ab.style.color='#ffd166';ab.onclick=showAch;skEl.appendChild(ab);
  const kb=document.createElement('button');kb.textContent='🔑 Коды';kb.style.color='#ffd166';kb.onclick=showCodes;skEl.appendChild(kb)}
function showStages(){
  skP.innerHTML='';
  const h=document.createElement('div');h.textContent='Этапы';h.style.cssText='font-size:24px;font-weight:800';skP.appendChild(h);
  const info={1:['🌌 Этап 1 · Орбита','Классика: собирай кристаллы и уворачивайся от камней.',best,'Открыт всегда'],
    2:['🌊 Этап 2 · Океан','Волны, ловушки и камни побыстрее.',best2,'Нужно 70 очков на этапе 1'],
    3:['🕳️ Этап 3 · Лабиринт','Чёрная дыра в центре, тьма вокруг и быстрые камни.',best3,'Нужно 50 очков на этапе 2'],
    4:['⚙️ Ивент · Шестерёнка','Шестерня меняет направление и тянет всё за собой. 50 очков = скин Шестерня.',best4,'Открыт всегда'],
    5:['🎭 Ивент · В маске','Земля в центре, на фоне человек в маске Elinion. 30 очков: он снимет маску, и станет гораздо сложнее. 50 очков: скин с его лицом.',best5,'Открыт всегда']};
  const list=document.createElement('div');list.style.cssText='display:flex;flex-direction:column;gap:10px;width:min(92vw,380px)';
  for(const i of [1,2,3,4,5]){const o=stOpen(i),d=info[i];
    const card=document.createElement('div');card.style.cssText='background:#14123a;border:2px solid '+(i===stage?'#4cc9f0':'#2b2a55')+';border-radius:14px;padding:12px 14px;opacity:'+(o?1:0.55);
    const t1=document.createElement('div');t1.textContent=(o?'':'🔒 ')+d[0];t1.style.cssText='font-size:17px;font-weight:800';
    const t2=document.createElement('div');t2.textContent=d[1];t2.style.cssText='font-size:13px;opacity:.8;margin-top:4px;font-weight:500';
    const t3=document.createElement('div');t3.textContent=o?('Рекорд: '+d[2]+(i===stage?' · выбран':' · нажми, чтобы выбрать')):d[3];t3.style.cssText='font-size:12px;color:#9be7ff;margin-top:6px';
    card.appendChild(t1);card.appendChild(t2);card.appendChild(t3);
    card.onclick=()=>{if(!o)return;stage=i;maskT=0;lvl=1;applyPal();skP.style.display='none';renderSkins()};
    list.appendChild(card)}
  skP.appendChild(list);
  const cl=document.createElement('div');cl.textContent='Закрыть';cl.style.cssText='margin-top:8px;padding:10px 24px;border-radius:10px;background:#ffd166;color:#0b0a1f;font-weight:800';cl.onclick=()=>{skP.style.display='none';renderSkins()};
  skP.appendChild(cl);skP.style.display='flex'}
function showCodes(){
  skP.innerHTML='';
  const h=document.createElement('div');h.textContent='Коды';h.style.cssText='font-size:24px;font-weight:800';skP.appendChild(h);
  const inp=document.createElement('input');inp.placeholder='Введи код';inp.maxLength=40;inp.autocomplete='off';inp.style.cssText='width:min(80vw,280px);padding:12px;border-radius:10px;border:2px solid #2b2a55;background:#14123a;color:#fff;font:600 18px system-ui,sans-serif;text-align:center';
  const msg=document.createElement('div');msg.style.cssText='min-height:22px;font-size:15px;text-align:center';
  const go=document.createElement('div');go.textContent='Ввести';go.style.cssText='padding:10px 24px;border-radius:10px;background:#ffd166;color:#0b0a1f;font-weight:800';
