<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>Орбита</title>
<style>
:root{--bg:#0b0a1f;--ring:#3b3a6b;--ship:#ffd166;--bad:#ff4d6d;--gem:#4cc9f0;--ink:#f2f0ff;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#nick{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(11,10,31,.92);color:var(--ink);font:600 18px system-ui,sans-serif;z-index:5}
#nick input{font:inherit;padding:12px 16px;border-radius:10px;border:2px solid var(--ring);background:#14123a;color:var(--ink);text-align:center;width:min(70vw,260px);-webkit-user-select:text;user-select:text}
#nick button{font:inherit;padding:12px 28px;border:0;border-radius:10px;background:var(--ship);color:#0b0a1f;font-weight:800}
#skins{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:center;gap:6px;z-index:4;flex-wrap:wrap;padding:0 8px}
#skins button{font:600 15px system-ui,sans-serif;padding:7px 8px;border-radius:10px;background:#14123a;border:2px solid transparent}
#achP>:first-child,#skP>:first-child{margin-top:auto}#achP>:last-child,#skP>:last-child{margin-bottom:auto}
#achP{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:10px;background:rgba(11,10,31,.95);color:var(--ink);font:600 16px system-ui,sans-serif;z-index:6;padding:24px;text-align:center;overflow-y:auto}
#skP{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:12px;background:rgba(11,10,31,.96);color:var(--ink);font:600 16px system-ui,sans-serif;z-index:6;padding:24px;overflow-y:auto}
#pauseBtn{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:4;font:700 20px system-ui,sans-serif;width:44px;height:44px;border-radius:12px;border:2px solid #3b3a6b;background:#14123a;color:#f2f0ff;display:none}
#stBtn{position:fixed;left:10px;right:10px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:4;display:none;gap:6px;justify-content:center}
#stBtn button{flex:1;max-width:110px;font:700 13px system-ui,sans-serif;padding:10px 4px;border-radius:12px;border:2px solid #4cc9f0;background:#14123a;color:#9be7ff}
</style>

  const gl=g.createRadialGradient(cx,cy,BR*0.9,cx,cy,BR*2.6);gl.addColorStop(0,'rgba(255,140,60,.55)');gl.addColorStop(0.4,'rgba(150,50,220,.28)');gl.addColorStop(1,'rgba(80,0,140,0)');
  g.fillStyle=gl;g.beginPath();g.arc(cx,cy,BR*2.6,0,6.283);g.fill();
  g.globalCompositeOperation='lighter';g.translate(cx,cy);g.rotate(-0.35+Math.sin(tt*0.3)*0.05);
  for(let i=0;i<4;i++){g.lineWidth=5-i;g.strokeStyle=['rgba(255,190,90,.8)','rgba(255,120,60,.6)','rgba(190,80,255,.5)','rgba(120,60,220,.4)'][i];g.beginPath();g.ellipse(0,0,BR*(1.45+i*0.22),BR*(0.42+i*0.09),0,tt*(1.2-i*0.2)%6.283,tt*(1.2-i*0.2)%6.283+5.2);g.stroke()}
  g.restore();g.save();g.translate(cx,cy);g.fillStyle='#000';g.shadowColor='#b66dff';g.shadowBlur=22;g.beginPath();g.arc(0,0,BR,0,6.283);g.fill();g.shadowBlur=0;
  g.strokeStyle='rgba(255,230,180,.85)';g.lineWidth=2;g.beginPath();g.arc(0,0,BR,0,6.283);g.stroke();g.restore()}
  else{g.fillStyle=gr;g.beginPath();g.arc(cx,cy,PR,0,6.283);g.fill()}
  if(mode!=='menu'){
    for(const q of gems){const rr=q.ring===undefined?R:RR(q.ring),x=cx+Math.cos(q.a)*rr,y=cy+Math.sin(q.a)*rr,s=9+Math.sin(performance.now()/120)*2;
      if(q.trap){const ts=s+4;g.globalAlpha=(q.age||0)>0.6?1:0.45;g.fillStyle=C.bad;g.beginPath();g.arc(x,y,ts,0,6.283);g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x,y,ts+3+Math.sin(performance.now()/90)*2,0,6.283);g.stroke();g.beginPath();g.moveTo(x-5,y-5);g.lineTo(x+5,y+5);g.moveTo(x+5,y-5);g.lineTo(x-5,y+5);g.stroke();continue}
      g.globalAlpha=Math.min(1,q.life);g.fillStyle=C.gem;g.beginPath();g.moveTo(x,y-s);g.lineTo(x+s*.7,y);g.lineTo(x,y+s);g.lineTo(x-s*.7,y);g.fill();g.globalAlpha=1}
    for(const q of pups){const rr=q.ring===undefined?R:RR(q.ring),x=cx+Math.cos(q.a)*rr,y=cy+Math.sin(q.a)*rr;
      const pc=q.k==='t'?'#c8b6ff':q.k==='m'?'#ff9f43':'#9bf6a0';g.globalAlpha=Math.min(1,q.life);g.strokeStyle=pc;g.lineWidth=4;g.beginPath();g.arc(x,y,11+Math.sin(performance.now()/150)*2,0,6.283);g.stroke();
      g.fillStyle=pc;g.beginPath();g.arc(x,y,4,0,6.283);g.fill();
      if(q.k==='t'){g.lineWidth=2;g.beginPath();g.moveTo(x,y);g.lineTo(x,y-8);g.moveTo(x,y);g.lineTo(x+6,y);g.stroke()}
      if(q.k==='m'){g.lineWidth=3;g.beginPath();g.arc(x,y+1,6,Math.PI,0,true);g.stroke()}g.globalAlpha=1}
    if(boss){const x=cx+Math.cos(boss.a)*R*1.6,y=cy+Math.sin(boss.a)*R*1.6,s=26+Math.sin(performance.now()/200)*3;
      if(stage===6)drawFB(x,y,s*1.15);else{g.save();g.translate(x,y);g.rotate(performance.now()/900);g.fillStyle=boss.hit>0?'#fff':C.bad;g.shadowColor=C.bad;g.shadowBlur=20;g.beginPath();
      for(let i=0;i<8;i++){const an=i/8*6.283,r=s*(i%2?0.6:1.1);g.lineTo(Math.cos(an)*r,Math.sin(an)*r)}g.fill();g.restore()}}
    for(const h of haz){g.save();g.translate(h.x,h.y);g.rotate(h.rot);g.fillStyle=slow>0?'#8ecae6':C.bad;g.beginPath();
      const NP=stage===2?12:7;for(let i=0;i<NP;i++){const an=i/NP*6.283,r=h.r*(i%2?(stage===2?0.55:0.75):1.05);g.lineTo(Math.cos(an)*r,Math.sin(an)*r)}g.fill();g.restore()}
    for(const p of trail){g.globalAlpha=Math.max(p.l,0)*.5;g.fillStyle=SK[skin].t||C.ship;g.beginPath();g.arc(p.x,p.y,5*p.l+1,0,6.283);g.fill()}
    g.globalAlpha=1;
    if(mode==='play'){const RS=stage===3?shipR:R,px=cx+Math.cos(a)*RS,py=cy+Math.sin(a)*RS;
      g.fillStyle=C.ship;g.shadowColor=C.ship;g.shadowBlur=18;g.beginPath();drawSkin(px,py);g.shadowBlur=0;
      if(shield){g.strokeStyle='#9bf6a0';g.lineWidth=3;g.beginPath();g.arc(px,py,16+Math.sin(performance.now()/100)*1.5,0,6.283);g.stroke()}
      if(mag>0){g.strokeStyle='#ff9f43';g.lineWidth=2;g.beginPath();g.arc(px,py,24,0,6.283);g.stroke()}}
  }
  if(stage===8&&blizA>0.01){const tt=performance.now()/1000,sx=cx+Math.cos(a)*R,sy=cy+Math.sin(a)*R,bg=g.createRadialGradient(sx,sy,60,sx,sy,260);bg.addColorStop(0,'rgba(225,238,255,0)');bg.addColorStop(1,'rgba(225,238,255,'+(0.82*blizA)+')');g.fillStyle=bg;g.fillRect(-40,-40,W+80,H+80);
    g.fillStyle='rgba(255,255,255,'+(0.7*blizA)+')';for(let i=0;i<90;i++){const x=(((i*7919)%1000)/1000*W+tt*(160+(i%7)*40))%W,y=(((i*104729)%1000)/1000*H+Math.sin(tt*2+i)*20+tt*(60+(i%5)*20))%H;g.fillRect(x,y,2.5,2.5)}}
  if(stage===3&&mode==='play'){const dx0=cx+Math.cos(a)*shipR,dy0=cy+Math.sin(a)*shipR;const dg=g.createRadialGradient(dx0,dy0,160,dx0,dy0,420);dg.addColorStop(0,'rgba(0,0,0,0)');dg.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=dg;g.fillRect(-40,-40,W+80,H+80)}
  g.restore();
  const top=Math.max(56,H*0.08);
  if(mode==='play'){text(String(score),cx,top+24,56,C.ink,800);
    text((stage===8?'Пустошь':stage===7?'Башня':stage===6?'Лес':stage===5?'В маске':stage===4?'Ивент '+(gearDir>0?'↻':'↺'):stage===3?'Лабиринт':'Уровень '+lvl)+(shield?'  ·  щит активен':''),cx,top+52,15,shield?'#9bf6a0':C.ring,600);
    if(slow>0)text('время остановлено '+Math.ceil(slow)+' с',cx,top+118,14,'#c8b6ff',600);
    if(mag>0)text('магнит '+Math.ceil(mag)+' с',cx,top+138,14,'#ff9f43',600);
    if(stage===8&&blizD>0.3)text('❄ метель: смотри за кораблём',cx,top+76,14,'#bfe6ff',700);
    if(toastT>0)text('Достижение: '+toast,cx,top-14,16,'#ffd166',700);
    if(boss){const bw=Math.min(W*0.6,260);g.fillStyle=C.ring;g.fillRect(cx-bw/2,top+66,bw,8);g.fillStyle=C.bad;g.fillRect(cx-bw/2,top+66,bw*boss.hp/boss.max,8);text('Босс',cx,top+92,14,C.bad,700)}
    if(banner>0){g.globalAlpha=Math.min(1,banner);text(stage===8?'Пустошь':stage===7?'Башня':stage===6?'Лес':stage===5?'В маске':stage===4?'Ивент':stage===3?'Лабиринт':'Уровень '+lvl,cx,cy+8,36,C.ink,800);g.globalAlpha=1}}
  if(mode==='menu'){
    text(stage===8?'Ледяная пустошь':stage===7?'Часовая башня':stage===6?'Лес':stage===5?'В маске':stage===4?'Ивент':stage===3?'Лабиринт':stage===2?'Океан':'Орбита',cx,cy-R-50,stage===8?38:48,C.ink,800);
    drawBoard(top+26);
    text(stage===5?'30 очков: он снимет маску · 50 очков: скин':stage===4?'Набери 50 очков и получи скин Шестерня':stage===3?'Коснись экрана, чтобы сменить направление':'Коснись экрана, чтобы сменить направление',cx,cy+R+60,16,C.ink,500);
    text(isEv()?'Сложнее обычного: быстрые камни, без мин':stage===8?'Лёд скользкий, а метель закрывает обзор':stage===7?'Стрелки перекрывают путь: проскакивай между ними':stage===6?'Лес: быстрые камни, мины и другие боссы':stage===3?'Вокруг тьма, камни быстрее, будь осторожен':'Собирай кристаллы, уворачивайся от камней',cx,cy+R+86,16,C.gem,500);
    text('Коснись, чтобы начать',cx,cy+4,20,C.ship,700);
    if(bb())text('Рекорд: '+bb(),cx,cy+R+122,16,C.ink,500);
  }
  if(paused&&mode==='play'){g.fillStyle='rgba(11,10,31,.65)';g.fillRect(0,0,W,H);text('Пауза',cx,cy-10,44,C.ink,800);text('Коснись экрана или нажми Esc, чтобы продолжить',cx,cy+30,15,C.gem,500)}
  if(mode==='over'){
    g.fillStyle='rgba(11,10,31,.72)';g.fillRect(0,0,W,H);
    text('Столкновение',cx,cy-60,40,C.bad,800);
    text('Кристаллов: '+score,cx,cy,28,C.ink,700);
    text(score>=bb()&&score>0?'Новый рекорд!':'Рекорд: '+bb(),cx,cy+36,18,C.ship,600);
    if(overT>0.5)text('Коснись, чтобы сыграть ещё',cx,cy+96,18,C.gem,600);
    drawBoard(cy+140);
  }
}
let last=performance.now();
(function loop(n){const dt=Math.min((n-last)/1000,0.05);last=n;if(mode!=='play'&&paused)setPause(false);if(!paused)step(dt);draw();requestAnimationFrame(loop)})(last);
</script>
